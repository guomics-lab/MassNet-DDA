name: Security regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-boundaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install small test dependencies
        run: python -m pip install numpy==2.2.6 lmdb==1.7.5
      - name: Run security regressions without CUDA or network fixtures
        run: python -m unittest discover -s tests/security -p 'test_*.py' -v
